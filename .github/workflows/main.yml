name: Build and deploy

# A push to master runs the tests and checks that the image builds. Publishing a GitHub release vX.Y.Z (the version
# in backend/package.json and frontend/pubspec.yaml) also pushes the image as X.Y.Z, X.Y and latest, deploys it and
# attaches the APK.
on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# Never run two deploys at the same time, finish the running one first
concurrency:
  group: ${{ github.event_name == 'release' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/run-tests.yml

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        if: github.event_name == 'release'
        run: |
          backend=$(node -p "require('./backend/package.json').version")
          frontend=$(sed -n 's/^version: *\([^+]*\).*/\1/p' frontend/pubspec.yaml)
          [ "v$backend" = "$GITHUB_REF_NAME" ] || { echo "backend/package.json has $backend, tag $GITHUB_REF_NAME"; exit 1; }
          [ "v$frontend" = "$GITHUB_REF_NAME" ] || { echo "frontend/pubspec.yaml has $frontend, tag $GITHUB_REF_NAME"; exit 1; }

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/renautmestdagh/wled
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://leds.rennet.duckdns.org
    steps:
      # Calls a deploy webhook (GitHub-style HMAC signature). Where it points is configured
      # in the production environment's secrets, not in this repo.
      - name: Trigger deploy webhook
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          # The ref must match the branch filter at the end of the webhook URL (/main), not this repo's branch
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$URL" \
            -H 'content-type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" -d "$body")
          echo "webhook answered HTTP $code"
          [ "$code" = 200 ] || { cat response.txt; exit 1; }

  apk:
    name: Build Android app
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: frontend/.fvmrc
          cache: true

      # The release key lives in Infisical (project ci, /android/wled-dashboard); GitHub logs in with OIDC, no stored secret
      - uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: 59a77282-0ae7-428f-99b2-b253c69e58d8
          domain: https://eu.infisical.com
          project-id: 815c357a-baf5-41fa-9d10-41f718c63a8a
          env-slug: prod
          secret-path: /android/wled-dashboard

      - name: Write signing key
        env:
          KEYSTORE: ${{ env.WLED_KEYSTORE_BASE64 }}
          PASSWORD: ${{ env.WLED_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] || { echo "WLED_KEYSTORE_BASE64 and WLED_KEYSTORE_PASSWORD are missing in Infisical"; exit 1; }
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=release\n' "$PASSWORD" "$PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/wled-dashboard.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/wled-dashboard.apk --clobber
