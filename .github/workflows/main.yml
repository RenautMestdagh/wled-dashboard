name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at the same time, finish the running one first
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: renautm/wled:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to rennet-nas
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://leds.rennet.duckdns.org
    steps:
      # Komodo pulls :latest and recreates the container. The API key belongs to a
      # Komodo service user that may only deploy the wled stack.
      # Keep the CLI version equal to Komodo Core (hosts/rennet-server/komodo in homelab).
      - name: Deploy wled via Komodo
        env:
          KOMODO_CLI_HOST: https://komodo.rennet.duckdns.org
          KOMODO_CLI_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_CLI_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          # The CLI image ships without CA certificates, borrow the runner's for HTTPS
          docker run --rm -e KOMODO_CLI_HOST -e KOMODO_CLI_KEY -e KOMODO_CLI_SECRET \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            ghcr.io/moghtech/komodo-cli:2.3.3 \
            km deploy -y stack wled 2>&1 | tee km.log
          # km exits 0 even when the deploy fails
          grep -q "EXECUTION SUCCESSFUL" km.log
