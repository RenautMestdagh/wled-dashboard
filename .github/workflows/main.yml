name: Build and deploy

# A push to main deploys the server, a v* tag releases the Android app, a manual run does both (the APK as a run artifact)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deploys at the same time, finish the running one first
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/renautmestdagh/wled:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://leds.rennet.duckdns.org
    steps:
      # Calls a deploy webhook (GitHub-style HMAC signature). Where it points is configured
      # in the production environment's secrets, not in this repo.
      - name: Trigger deploy webhook
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$URL" \
            -H 'content-type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" -d "$body")
          echo "webhook answered HTTP $code"
          [ "$code" = 200 ] || { cat response.txt; exit 1; }

  apk:
    name: Build Android app
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          cache: true

      # The release key lives in Infisical (project ci, /android); GitHub logs in with OIDC, no stored secret
      - uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: 59a77282-0ae7-428f-99b2-b253c69e58d8
          domain: https://eu.infisical.com
          project-id: 815c357a-baf5-41fa-9d10-41f718c63a8a
          env-slug: prod
          secret-path: /android

      - name: Write signing key
        env:
          KEYSTORE: ${{ env.WLED_KEYSTORE_BASE64 }}
          PASSWORD: ${{ env.WLED_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] || { echo "WLED_KEYSTORE_BASE64 and WLED_KEYSTORE_PASSWORD are missing in Infisical"; exit 1; }
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=release\n' "$PASSWORD" "$PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && version="--build-name ${GITHUB_REF_NAME#v}"
          flutter build apk --release $version --build-number "$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/app-release.apk --generate-notes
