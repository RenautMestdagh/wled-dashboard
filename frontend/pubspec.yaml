name: wled_dashboard
description: Control WLED lights through the WLED dashboard backend.
publish_to: 'none'

# The app follows the backend's version (backend/package.json); the release workflow checks both against the tag
version: 1.2.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: launcher_icon
  ios: false
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: '#ffffff'
    theme_color: '#388e3c'

flutter_native_splash:
  color: '#ffffff'
  color_dark: '#000000'
  android_12:
    image: assets/icon/splash.png
    color: '#ffffff'
    icon_background_color: '#ffffff'
    image_dark: assets/icon/splash.png
    color_dark: '#000000'
    icon_background_color_dark: '#000000'
  ios: false
  web: false
